<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Say It With Flowers</title>
  <style>
    body { font-family: Arial, sans-serif; background: #fbeef3; color: #2a1d3d; text-align: center; padding: 20px; }
    button { font-size: 18px; padding: 8px 14px; margin: 4px; border-radius: 20px; border: 2px solid #cdb8ec; background: white; cursor: pointer; }
    button.active { background: #2a1d3d; color: white; }
    #garden { position: relative; height: 350px; max-width: 800px; margin: 20px auto; background: linear-gradient(#e9dcff, #fbeef3); border-radius: 20px; border: 2px solid #cdb8ec; overflow: hidden; cursor: crosshair; }
    .flower { position: absolute; font-size: 40px; transform: translate(-50%, -50%); }
  </style>
</head>
<body>
<h1>Say It With Flowers</h1>
  <p>Pick a flower, then click the garden to plant it.</p>

  <div id="buttons"></div>
  <div id="garden"></div>
  <h2 id="message"></h2>
  <button onclick="clearGarden()">Clear garden</button>

  <script>
    // Each flower has an emoji and a meaning
    var flowers = {
      "🌹": "love",
      "🌻": "loyalty",
      "🌼": "a fresh start",
      "🪻": "calm",
      "🌷": "good news"
    };

    var selected = "🌹";
    var planted = [];

    var garden = document.getElementById("garden");
    var message = document.getElementById("message");
    var buttons = document.getElementById("buttons");

    // Make a button for each flower
    for (var emoji in flowers) {
      var b = document.createElement("button");
      b.textContent = emoji + " " + flowers[emoji];
      b.dataset.emoji = emoji;
      b.onclick = function () {
        selected = this.dataset.emoji;
        var all = buttons.children;
        for (var i = 0; i < all.length; i++) all[i].classList.remove("active");
        this.classList.add("active");
      };
      buttons.appendChild(b);
    }
    buttons.children[0].classList.add("active");

    // Plant a flower where you click
    garden.onclick = function (e) {
      var box = garden.getBoundingClientRect();
      var f = document.createElement("div");
      f.className = "flower";
      f.textContent = selected;
      f.style.left = (e.clientX - box.left) + "px";
      f.style.top = (e.clientY - box.top) + "px";
      garden.appendChild(f);

      if (planted.indexOf(selected) === -1) planted.push(selected);
      showMessage();
    };

    function showMessage() {
      var meanings = planted.map(function (e) { return flowers[e]; });
      message.textContent = "Your garden says: " + meanings.join(", ") + ".";
    }

    function clearGarden() {
      garden.innerHTML = "";
      planted = [];
      message.textContent = "";
    }
  </script>

</body>
</html>
